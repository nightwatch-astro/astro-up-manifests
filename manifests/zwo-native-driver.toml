manifest_version = 1
id = "zwo-native-driver"
name = "ZWO ASI Native Camera Driver"
description = "Native USB camera driver for all ZWO ASI cameras"
publisher = "ZWO"
homepage = "https://www.zwoastro.com"
category = "driver"
type = "driver"
tags = ["camera", "zwo"]
slug = "zwo-native-driver"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\ZWO\\ASICamera"
registry_value = "Version"

[install]
method = "nsis"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "redirect"
url = "https://dl.zwoastro.com/software?app=AsiCameraDriver&platform=windows64&region=Overseas"
regex = 'ASI_Cameras_driver_Setup_V(\d+\.\d+\.\d+(?:\.\d+)?)\.exe'

[checkver.autoupdate]
url = "https://dl.zwoastro.com/software?app=AsiCameraDriver&platform=windows64&region=Overseas"
