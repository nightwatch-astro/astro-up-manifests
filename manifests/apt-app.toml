manifest_version = 1
id = "apt-app"
name = "Astro Photography Tool"
description = "Astro Photography Tool — DSO imaging and session automation"
publisher = "APT"
homepage = "https://astrophotography.app"
category = "imaging"
type = "application"
tags = ["imaging", "capture", "sequencer", "apt"]
slug = "apt-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "html_scrape"
url = "https://astrophotography.app/downloads.php"
regex = 'UnReg(\d+_\d+(?:_\d+)?)\.exe'

[checkver.autoupdate]
url = "https://astrophotography.app/APT_UnReg$version.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{81F5BD58-9631-4FA7-B85D-C9BA948CF785}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\Astro Photography Tool - APT\\APT.exe"
