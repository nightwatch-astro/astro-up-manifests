manifest_version = 1
id = "lunatico-cloudwatcher-software"
name = "Lunatico AAG CloudWatcher Data Display"
description = "Data display software for Lunatico AAG CloudWatcher"
publisher = "Lunatico Astronomia"
homepage = "https://lunaticoastro.com"
category = "driver"
type = "application"
slug = "lunatico-cloudwatcher-software"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "pe_download"
url = "https://lunaticoastro.com/aagcw/current/CWDataDisplay-Install.exe"

[checkver.autoupdate]
url = "https://lunaticoastro.com/aagcw/current/CWDataDisplay-Install.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\CloudWatcher Data Display_is1"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\CWDataDisplay\\CloudWatcherDataDisplay.exe"
