manifest_version = 1
id = "wanderer-empire"
name = "WandererEmpire"
description = "WandererEmpire — unified control and ASCOM drivers for Wanderer rotators, covers, power boxes, focusers, and filter wheels"
publisher = "Wanderer Astro"
homepage = "https://www.wandererastro.com"
category = "driver"
type = "application"
slug = "wanderer-empire"

[install]
method = "exe"
elevation = "required"

[checkver]
provider = "browser_scrape"
url = "https://www.wandererastro.com/en/h-col-106.html"
regex = 'WandererEmpire-V(\d+\.\d+\.\d+)-Setup'

# No autoupdate URL — Wanderer uses a CDN with dynamic hashed URLs.
# The scraper discovers the version; the download link must be resolved
# from the downloads page at install time.

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{wandererempire}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\Wanderer Astro\\ASCOM.WandererBox1.exe"
