manifest_version = 1
id = "sx-fw-ascom"
name = "Starlight Xpress Filter Wheel ASCOM Driver"
description = "ASCOM driver for Starlight Xpress filter wheels"
publisher = "Starlight Xpress"
homepage = "https://www.sxccd.com"
category = "driver"
type = "driver"
slug = "sx-fw-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://www.sxccd.com/support/resources/"
regex = 'ascom-(\d+)\.'

[checkver.autoupdate]
url = "https://www.sxccd.com/wp-content/files/ascom-1.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{b56ae4fc-baf0-4ece-a46f-3152c38e3285}_is1"
registry_value = "DisplayVersion"
