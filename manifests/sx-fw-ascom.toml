manifest_version = 1
id = "sx-fw-ascom"
name = "Starlight Xpress Filter Wheel ASCOM Driver"
description = "ASCOM driver for Starlight Xpress filter wheels"
publisher = "Starlight Xpress"
homepage = "https://www.sxccd.com"
category = "driver"
type = "driver"
slug = "sx-fw-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://www.sxccd.com/support/resources/"
regex = 'ascom-(\d+)\.'

[checkver.autoupdate]
url = "https://www.sxccd.com/wp-content/files/ascom-1.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASTAP w08 star database up to magnitude 8_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\astap\\dcraw.exe"
