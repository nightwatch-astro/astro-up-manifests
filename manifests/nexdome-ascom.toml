manifest_version = 1
id = "nexdome-ascom"
name = "NexDome ASCOM Driver"
description = "ASCOM driver for NexDome observatory dome"
publisher = "NexDome"
homepage = "https://nexdome.com"
category = "driver"
type = "driver"
slug = "nexdome-ascom"

[install]
method = "exe"
elevation = "required"

[checkver]
provider = "github"
owner = "nexdome"
repo = "ASCOM"
tag_prefix = ""

[checkver.autoupdate]
url = "https://github.com/nexdome/ASCOM/releases/download/$version/NexDome-Setup.exe"
asset_filter = "\\.exe$"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{3837291A-B03A-418B-966B-983585934419}"
registry_value = "DisplayVersion"
