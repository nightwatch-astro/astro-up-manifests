manifest_version = 1
id = "player-one-camera-ascom"
name = "Player One Camera ASCOM Driver"
description = "ASCOM driver for Player One astronomy cameras"
publisher = "Player One Astronomy"
homepage = "https://player-one-astronomy.com"
category = "driver"
type = "driver"
tags = ["ascom", "camera", "playerone"]
slug = "player-one-camera-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://player-one-astronomy.com/service/software/"
regex = 'ASCOM_PlayerOne_Camera_Setup_V(\d+\.\d+\.\d+\.\d+)\.zip'

[checkver.autoupdate]
url = "https://player-one-astronomy.com/download/softwares/ASCOM_PlayerOne_Camera_Setup_V$version.zip"

[dependencies]
requires = ["ascom-platform", "player-one-native-driver"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{0cfb82be-5bf3-455b-bc8e-a89ecaf2ec42}_is1"
registry_value = "DisplayVersion"
