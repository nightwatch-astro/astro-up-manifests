manifest_version = 1
id = "celestron-cpwi"
name = "Celestron CPWI"
description = "CPWI mount control with ASCOM telescope/focuser"
publisher = "Celestron"
homepage = "https://www.celestron.com"
category = "driver"
type = "application"
slug = "celestron-cpwi"

[install]
method = "nsis"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "pe_download"
url = "https://software.celestron.com/public_release/Setup_CPWI.exe"

[checkver.autoupdate]
url = "https://software.celestron.com/public_release/Setup_CPWI.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{ 632E8128-01D0-4A69-9D75-F5B8FA2EC0DB}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\Celestron\\CPWI\\CPWI.exe"
