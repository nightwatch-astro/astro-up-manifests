manifest_version = 1
id = "ioptron-ipolar"
name = "iOptron iPolar"
description = "iOptron iPolar electronic polar alignment tool"
publisher = "iOptron"
homepage = "https://www.ioptron.com"
category = "driver"
type = "application"
tags = ["polar-alignment", "ioptron"]
slug = "ioptron-ipolar"

[install]
method = "exe"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "pe_download"
url = "https://www.ioptron.com/v/firmware/3339_iOptron_iPolar.exe"

[checkver.autoupdate]
url = "https://www.ioptron.com/v/firmware/3339_iOptron_iPolar.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{C15DDC0C-FC25-4CD5-9CA5-035014A4E6BB}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Users\\USER\\AppData\\Local\\iOptron iPolar\\iOptron iPolar.exe"
