manifest_version = 1
id = "qhy-qfocuser"
name = "QHY QFocuser ASCOM Driver"
description = "ASCOM driver for QHY QFocuser motorized focusers"
publisher = "QHY"
homepage = "https://www.qhyccd.com"
category = "driver"
type = "driver"
tags = ["ascom", "focuser", "qhy"]
slug = "qhy-qfocuser"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "browser_scrape"
url = "https://www.qhyccd.com/download/#a2"
regex = 'QFOCUS-ASCOM-Platform6-V(\d+\.\d+\.\d+\.\d+)\.exe'

[checkver.autoupdate]
url = "https://www.qhyccd.com/file/repository/ASCOM/QFOCUS-ASCOM-Platform6-V$version.exe"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{340ce2aa-2cac-4078-94f4-5e544936c399}_is1"
registry_value = "DisplayVersion"
