manifest_version = 1
id = "player-one-directshow"
name = "Player One Camera DirectShow Driver"
description = "DirectShow video driver for Player One cameras"
publisher = "Player One Astronomy"
homepage = "https://player-one-astronomy.com"
category = "driver"
type = "driver"
slug = "player-one-directshow"

[install]
method = "exe"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://player-one-astronomy.com/service/software/"
regex = 'DirectShow_PlayerOne_Camera_Driver_V(\d+\.\d+\.\d+\.\d+)\.zip'

[checkver.autoupdate]
url = "https://player-one-astronomy.com/download/softwares/DirectShow_PlayerOne_Camera_Driver_V$version.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{AFFA9880-7881-4DB5-AD03-8FA3B369D39B}_is1"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\PlayerOneAstronomyDshow\\POACamService.exe"
