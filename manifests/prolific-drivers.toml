manifest_version = 1
disabled = true  # Prolific no longer provides direct downloads; driver via Windows Update
id = "prolific-drivers"
name = "Prolific PL2303 Drivers"
description = "Prolific PL2303 USB-serial drivers — used by many astronomy mount cables"
publisher = "Prolific"
homepage = "https://www.prolific.com.tw"
category = "driver"
type = "driver"
tags = ["usb", "serial"]
slug = "prolific-drivers"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Prolific\\PL2303"
registry_value = "Version"

[install]
method = "exe"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "manual"
