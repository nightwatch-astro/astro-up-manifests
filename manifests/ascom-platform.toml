manifest_version = 1
id = "ascom-platform"
name = "ASCOM Platform"
description = "ASCOM Standards for Astronomy — driver interface platform"
publisher = "ASCOM Initiative"
homepage = "https://ascom-standards.org"
category = "prerequisites"
type = "runtime"
slug = "ascom-platform"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "github"
owner = "ASCOMInitiative"
repo = "ASCOMPlatform"

[checkver.autoupdate]
asset_filter = "\\.exe$"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASCOM Platform 7.1 Update 3"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\ASCOM\\Platform\\Tools\\ASCOM Diagnostics.exe"
