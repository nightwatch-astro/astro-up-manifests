manifest_version = 1
id = "phd2-app"
name = "PHD2"
description = "PHD2 — push here dummy autoguiding"
publisher = "OpenPHD"
homepage = "https://openphdguiding.org"
category = "guiding"
type = "application"
tags = ["guiding", "autoguider", "phd2"]
slug = "phd2-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "github"
owner = "OpenPHDGuiding"
repo = "phd2"

[checkver.autoupdate]
url = "https://openphdguiding.org/phd2-$version-installer.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\PHD 2_is1"
registry_value = "DisplayVersion"
