manifest_version = 1
id = "qhy-allinone"
name = "QHY AllInOne Driver Pack"
description = "AllInOne pack: system drivers, ASCOM camera and filter wheel drivers, WDM broadcast driver, EZCAP_QT, SDKs, and SharpCap"
publisher = "QHY"
homepage = "https://www.qhyccd.com"
category = "driver"
type = "driver"
slug = "qhy-allinone"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
# Stable version — match the "Recommended" link (appears after beta on page)
# Use js: selector to extract the stable URL from the second AllInOne link
provider = "browser_scrape"
url = "https://www.qhyccd.com/download/"
css_selector = "js:Array.from(document.querySelectorAll('a[href*=\"QHYCCD_Win_AllInOne\"]'))[1]?.href || ''"
regex = 'QHYCCD_Win_AllInOne\.(\d+\.\d+\.\d+\.\d+)\.exe'

# No autoupdate URL — download URL extracted from page as asset (like GitHub)

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{4BE2CEB1-D9AF-46F6-8410-C87F172A587D}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\QHYCCD\\AllInOne\\ascom\\QHYCCD-ASCOM-Platform6.5-V25.06.16.16.exe"
