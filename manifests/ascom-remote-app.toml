manifest_version = 1
id = "ascom-remote-app"
name = "ASCOM Remote Server"
description = "ASCOM Remote Server — network access to ASCOM devices"
publisher = "ASCOM Initiative"
homepage = "https://ascom-standards.org"
category = "utilities"
type = "application"
slug = "ascom-remote-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "github"
owner = "ASCOMInitiative"
repo = "ASCOMRemote"

[checkver.autoupdate]
asset_filter = "\\.exe$"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{0ee690ae-7927-4ee7-b851-f5877c077ff5}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\ASCOM\\RemoteServer\\RemoteServer.exe"
