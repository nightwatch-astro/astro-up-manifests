manifest_version = 1
id = "green-swamp-server-app"
name = "Green Swamp Server"
description = "Green Swamp Server (GSServer) — ASCOM telescope driver for SkyWatcher/Orion mounts"
publisher = "Green Swamp Server"
homepage = "https://greenswamp.org"
category = "utility"
type = "application"
slug = "green-swamp-server-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "github"
owner = "rmorgan001"
repo = "GSServer"

[checkver.autoupdate]
url = "https://github.com/rmorgan001/GSServer/releases/download/v$version/GreenSwampServer-$version-Setup.exe"
asset_filter = "\\.exe$"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{0ff78bd6-6149-4536-9252-3da68b94f7c2}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Telescope\\GSServer\\GS.ChartViewer.exe"
