manifest_version = 1
id = "astroasis-focuser-triple-ascom"
name = "Astroasis Triple Focuser ASCOM Driver"
description = "ASCOM driver variant that registers three Oasis Focuser devices for multi-focuser setups"
publisher = "Astroasis"
homepage = "https://www.astroasis.com"
category = "driver"
type = "driver"
slug = "astroasis-focuser-triple-ascom"

[install]
method = "exe"
zip_wrapped = true
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "html_scrape"
url = "https://www.astroasis.com/download/"
regex = 'Focuser_Triplet_ASCOM_(\d+\.\d+\.\d+\.\d+)_Setup'

[checkver.autoupdate]
url = "https://www.astroasis.com/download/files/focuser/Astroasis_Oasis_Focuser_Triplet_ASCOM_$version_Setup.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{3f45475d-8e69-4288-9a36-c770d14a7e96}_is1"
registry_value = "DisplayVersion"
