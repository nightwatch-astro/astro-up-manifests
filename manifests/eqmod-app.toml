manifest_version = 1
id = "eqmod-app"
name = "EQMOD"
description = "EQMOD — ASCOM driver for Synta/SkyWatcher EQ mounts"
publisher = "EQMOD Project"
homepage = "https://eq-mod.sourceforge.net"
category = "utility"
type = "application"
tags = ["ascom", "mount", "eqmod"]
slug = "eqmod-app"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "manual"
url = "https://sourceforge.net/projects/eq-mod/files/EQASCOM/"
version_format = "raw"

[checkver.autoupdate]
url = "https://sourceforge.net/projects/eq-mod/files/EQASCOM/EQASCOM_V200w_Setup.exe/download"
skip_browser_ua = true

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\EQMOD EQASCOM Telescope Driver_is1"
registry_value = "DisplayVersion"
