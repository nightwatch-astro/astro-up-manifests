manifest_version = 1
id = "eqmod-app"
name = "EQMOD"
description = "EQMOD — ASCOM driver for Synta/SkyWatcher EQ mounts"
publisher = "EQMOD Project"
homepage = "https://eq-mod.sourceforge.net"
category = "utilities"
type = "application"
slug = "eqmod-app"

[install]
method = "exe"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "html_scrape"
url = "https://sourceforge.net/projects/eq-mod/files/EQASCOM/"
regex = 'EQASCOM_V(\d+\w+)_Setup\.exe'

[checkver.autoupdate]
url = "https://sourceforge.net/projects/eq-mod/files/EQASCOM/EQASCOM_V$version_Setup.exe/download"
skip_browser_ua = true

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "pe_file"
path = "C:\\Program Files (x86)\\EQMOD\\eqascom_run.exe"
