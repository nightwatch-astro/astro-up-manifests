manifest_version = 1
id = "astroasis-fw-ascom"
name = "Astroasis Filter Wheel ASCOM Driver"
description = "ASCOM driver for Astroasis Oasis Filter Wheel"
publisher = "Astroasis"
homepage = "https://www.astroasis.com"
category = "driver"
type = "driver"
slug = "astroasis-fw-ascom"

[install]
method = "exe"
zip_wrapped = true
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "html_scrape"
url = "https://www.astroasis.com/download/"
regex = 'Filter_Wheel_ASCOM_(\d+\.\d+\.\d+\.\d+)_Setup'

[checkver.autoupdate]
url = "https://www.astroasis.com/download/files/filterwheel/Astroasis_Oasis_Filter_Wheel_ASCOM_$version_Setup.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{4c7fa56d-b586-4abf-806d-be8ff302910c}_is1"
registry_value = "DisplayVersion"
