manifest_version = 1
id = "primaluce-alto"
name = "PrimaLuce ALTO Software Package"
description = "Driver and software package for PrimaLuce ALTO telescope cover motor"
publisher = "PrimaLuce Lab"
homepage = "https://www.primalucelab.com"
category = "driver"
type = "driver"
slug = "primaluce-alto"

[install]
method = "exe"
zip_wrapped = true

[checkver]
provider = "browser_scrape"
url = "https://www.primalucelab.com/info/downloads.html"
regex = 'ALTO-software-package-(\d+-\d+(?:-\d+)*)\.zip'

[checkver.autoupdate]
url = "https://www.primalucelab.com/downloads/ALTO-software-package-1-4.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{6f22f133-5a31-4cd6-9e51-3ad456eeb98f}_is1"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\CoverCalibrator\\PLL\\ASCOM.Giotto.exe"
