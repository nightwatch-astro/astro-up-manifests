manifest_version = 1
id = "qhy-polemaster"
name = "QHY PoleMaster"
description = "QHY PoleMaster electronic polar alignment software"
publisher = "QHY"
homepage = "https://www.qhyccd.com"
category = "utilities"
type = "application"
slug = "qhy-polemaster"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "browser_scrape"
url = "https://www.qhyccd.com/download/"
regex = 'PoleMaster_QtforWindows_V(\d+\.\d+\.\d+\.\d+)\.zip'

[checkver.autoupdate]
url = "https://www.qhyccd.com/file/repository/latestSoftAndDirver/Soft/PoleMaster_QtforWindows_V$version.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{0552F2CD-F94D-43E0-9DC6-0008716B5112}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\QHYCCD\\PoleMaster_Qt\\PoleMaster_Qt\\PoleMaster.exe"
