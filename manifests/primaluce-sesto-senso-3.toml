manifest_version = 1
id = "primaluce-sesto-senso-3"
name = "PrimaLuce SESTO SENSO 3 Software Package"
description = "Driver and software package for PrimaLuce SESTO SENSO 3 robotic focusing motor"
publisher = "PrimaLuce Lab"
homepage = "https://www.primalucelab.com"
category = "driver"
type = "driver"
tags = ["ascom", "focuser", "primaluce"]
slug = "primaluce-sesto-senso-3"

[install]
method = "exe"
zip_wrapped = true

[checkver]
provider = "browser_scrape"
url = "https://www.primalucelab.com/info/downloads.html"
regex = 'SESTO-SENSO-3-software-package-(\d+-\d+(?:-\d+)*)\.zip'

[checkver.autoupdate]
url = "https://www.primalucelab.com/downloads/SESTO-SENSO-3-software-package-1-0.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{a670a01f-e7af-49c9-aa67-b9fe518d7b35}_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Focuser\\PLL\\ASCOM.ArcoEsatto.exe"
