manifest_version = 1
id = "cp210x-drivers"
name = "Silicon Labs CP210x Drivers"
description = "Silicon Labs CP210x USB to UART bridge VCP drivers"
publisher = "Silicon Labs"
homepage = "https://www.silabs.com"
category = "driver"
type = "driver"
tags = ["usb", "serial"]
slug = "cp210x-drivers"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\SiLabs\\CP210x"
registry_value = "Version"

[install]
method = "download_only"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "manual"
url = "https://www.silabs.com/documents/public/software/CP210x_Universal_Windows_Driver.zip"

[checkver.autoupdate]
url = "https://www.silabs.com/documents/public/software/CP210x_Universal_Windows_Driver.zip"
