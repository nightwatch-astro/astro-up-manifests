manifest_version = 1
id = "celestron-cfm"
name = "Celestron Firmware Manager"
description = "Firmware update utility for Celestron telescopes and accessories"
publisher = "Celestron"
homepage = "https://www.celestron.com"
category = "driver"
type = "application"
tags = ["firmware", "celestron"]
slug = "celestron-cfm"

[install]
method = "download_only"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://software.celestron.com/updates/CFM/CFM/release.json"
regex = '"version"\s*:\s*"([\d.]+)"'

[checkver.autoupdate]
url = "https://software.celestron.com/updates/CFM/CFM/CFM_$version_windows_x86.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{701FE845-D79C-35E9-8DB8-A0E2834B4BC5}"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files\\Celestron\\CelestronFirmwareManager.exe"
