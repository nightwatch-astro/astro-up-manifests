manifest_version = 1
id = "moonlite-dro-ascom"
name = "MoonLite DRO Focuser ASCOM Driver"
description = "Universal ASCOM driver for all MoonLite focuser controllers"
publisher = "MoonLite"
homepage = "https://focuser.com"
category = "driver"
type = "driver"
tags = ["ascom", "focuser", "moonlite"]
slug = "moonlite-dro-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "manual"

[checkver.autoupdate]
url = "https://focuser.com/media/Downloads/MoonLite_Software/Ascom/MoonLite%20DRO%20Setup.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{65bb1fc6-0e7c-4d60-bd4a-9003563baad6}_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Focuser\\Moonlite\\ASCOM.Moonlite.Server.exe"
