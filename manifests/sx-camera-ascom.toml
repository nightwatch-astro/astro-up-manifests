manifest_version = 1
id = "sx-camera-ascom"
name = "Starlight Xpress Camera ASCOM Driver"
description = "ASCOM driver for Starlight Xpress CCD cameras"
publisher = "Starlight Xpress"
homepage = "https://www.sxccd.com"
category = "driver"
type = "driver"
tags = ["ascom", "camera", "starlight-xpress"]
slug = "sx-camera-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://www.sxccd.com/support/resources/"
regex = '-v(\d+\.\d+\.\d+\.\d+)\.'

[checkver.autoupdate]
url = "https://www.sxccd.com/wp-content/files/sxAscomInstaller-v6.2.1.18182.exe_.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\sxASCOM_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Camera\\sxCamera\\ASCOM.sxCamera.exe"
