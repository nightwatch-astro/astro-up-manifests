manifest_version = 1
id = "astap-d80"
name = "ASTAP D80 Star Database"
description = "Very large star database for ASTAP plate solver (1.2 GB)"
publisher = "ASTAP"
homepage = "https://www.hnsky.org/astap.htm"
category = "platesolving"
type = "database"
slug = "astap-d80"

[install]
method = "inno_setup"
elevation = "required"

[checkver]
provider = "manual"
url = "https://sourceforge.net/projects/astap-program/files/star_databases/d80_star_database.exe/download"

[checkver.autoupdate]
url = "https://sourceforge.net/projects/astap-program/files/star_databases/d80_star_database.exe/download"
skip_browser_ua = true

[dependencies]
requires = ["astap-app"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASTAP D80 star database. Star density up to 8000~93F1C46F_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\astap\\dcraw.exe"
