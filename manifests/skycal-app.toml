manifest_version = 1
id = "skycal-app"
name = "SkyCal Focus and Collimation Tool"
description = "SkyCal — Bahtinov mask focus and collimation analysis tool"
publisher = "Chris Dowd"
homepage = "https://github.com/insertnamehere1/Bahtinov-Collimator"
category = "utility"
type = "application"
tags = ["focus", "collimation", "bahtinov"]
slug = "skycal-app"

# ClickOnce bootstrapper — downloads and installs via ClickOnce
[install]
method = "exe"

[checkver]
provider = "github"
owner = "insertnamehere1"
repo = "Bahtinov-Collimator"

[checkver.autoupdate]
asset_filter = "SkyCal-Setup\\.exe$"

# v4 uses standalone Setup.exe installer (not ClickOnce)
[detection]
method = "registry"
registry_key = "HKEY_CURRENT_USER\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\b51949853d8f19f1"
registry_value = "DisplayVersion"
