manifest_version = 1
id = "moonlite-nitecrawler-ascom"
name = "MoonLite NiteCrawler ASCOM Driver"
description = "ASCOM driver for MoonLite NiteCrawler focuser/rotator"
publisher = "MoonLite"
homepage = "https://focuser.com"
category = "driver"
type = "driver"
tags = ["ascom", "focuser", "moonlite"]
slug = "moonlite-nitecrawler-ascom"

[install]
method = "inno_setup"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://focuser.com/downloads.php"
regex = 'NiteCrawler\s+Setup\s+(\d+\.\d+\.\d+)'

[checkver.autoupdate]
url = "https://focuser.com/media/Downloads/NiteCrawler/Ascom/NiteCrawler%20Setup%20$version.zip"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{a4a31249-f8c9-4890-9dd5-7e6070270038}_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Focuser\\NiteCrawler\\ASCOM.NiteCrawler.Server.exe"
