manifest_version = 1
id = "astap-w08"
name = "ASTAP W08 Wide Field Database"
description = "Wide field star database for ASTAP plate solver"
publisher = "ASTAP"
homepage = "https://www.hnsky.org/astap.htm"
category = "platesolving"
type = "database"
slug = "astap-w08"

[install]
method = "inno_setup"
elevation = "required"

[checkver]
provider = "manual"
url = "https://sourceforge.net/projects/astap-program/files/star_databases/w08_star_database_mag08_astap.exe/download"

[checkver.autoupdate]
url = "https://sourceforge.net/projects/astap-program/files/star_databases/w08_star_database_mag08_astap.exe/download"
skip_browser_ua = true

[dependencies]
requires = ["astap-app"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASTAP w08 star database up to magnitude 8_is1"
registry_value = "DisplayVersion"
