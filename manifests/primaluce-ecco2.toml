manifest_version = 1
id = "primaluce-ecco2"
name = "PrimaLuce ECCO2 Software Package"
description = "Driver and software package for PrimaLuce ECCO2 environmental controller"
publisher = "PrimaLuce Lab"
homepage = "https://www.primalucelab.com"
category = "driver"
type = "driver"
tags = ["ascom", "dew-heater", "primaluce"]
slug = "primaluce-ecco2"

[install]
method = "exe"
zip_wrapped = true

[checkver]
provider = "browser_scrape"
url = "https://www.primalucelab.com/info/downloads.html"
regex = 'ECCO2-software-package-(\d+-\d+(?:-\d+)*)\.zip'

[checkver.autoupdate]
url = "https://www.primalucelab.com/downloads/ECCO2-software-package-3-2.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{66647901-73a4-43e1-960d-dd91aaf44438}_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\ObservingConditions\\PLL\\ASCOM.ObCo_srv.exe"
