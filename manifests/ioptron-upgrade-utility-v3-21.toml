manifest_version = 1
id = "ioptron-upgrade-utility-v3-21"
name = "iOptron Upgrade Utility V3.21"
description = "Firmware upgrade utility for iOptron mounts (V3.21, legacy models)"
publisher = "iOptron"
homepage = "https://www.ioptron.com"
category = "driver"
type = "application"
tags = ["firmware", "mount", "ioptron"]
slug = "ioptron-upgrade-utility-v3-21"

[install]
method = "download_only"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "browser_scrape"
url = "https://www.ioptron.com/Articles.asp?ID=345"
regex = 'Utility_V(\d+)\.exe'

[checkver.autoupdate]
url = "https://www.ioptron.com/v/firmware/iOptronUpgradeUtility_V321.exe"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{43B0D101-A022-48F4-9D04-BA404CEB1D53}"
registry_value = "DisplayVersion"
