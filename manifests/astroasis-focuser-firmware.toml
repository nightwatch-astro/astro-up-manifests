manifest_version = 1
id = "astroasis-focuser-firmware"
name = "Astroasis Focuser Firmware"
description = "Firmware update for Astroasis Oasis Focuser Rose"
publisher = "Astroasis"
homepage = "https://www.astroasis.com"
category = "driver"
type = "firmware"
slug = "astroasis-focuser-firmware"

[install]
method = "download_only"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://www.astroasis.com/download/"
regex = 'Focuser_Rose_Firmware_Ver_(\d+\.\d+\.\d+)'

[checkver.autoupdate]
url = "https://www.astroasis.com/download/files/focuser/Oasis_Focuser_Rose_Firmware_Ver_$version.zip"

[detection]
method = "ledger"
