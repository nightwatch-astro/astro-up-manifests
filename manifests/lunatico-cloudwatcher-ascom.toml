manifest_version = 1
id = "lunatico-cloudwatcher-ascom"
name = "Lunatico AAG CloudWatcher ASCOM Driver"
description = "ASCOM driver for Lunatico AAG CloudWatcher weather station"
publisher = "Lunatico Astronomia"
homepage = "https://lunaticoastro.com"
category = "driver"
type = "driver"
tags = ["ascom", "weather", "lunatico"]
slug = "lunatico-cloudwatcher-ascom"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "pe_download"
url = "https://lunaticoastro.com/aagcw/CWAscom-Install.exe"

[checkver.autoupdate]
url = "https://lunaticoastro.com/aagcw/CWAscom-Install.exe"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\CloudWatcher ASCOM drivers_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\CWAscom\\ASCOM.CloudWatcher.Server.exe"
