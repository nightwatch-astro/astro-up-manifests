manifest_version = 1
id = "synscan-app-ascom"
name = "SynScan App ASCOM Driver"
description = "ASCOM driver for SynScan App mount control"
publisher = "Sky-Watcher"
homepage = "https://www.skywatcher.com"
category = "driver"
type = "driver"
tags = ["ascom", "mount", "skywatcher"]
slug = "synscan-app-ascom"

[install]
method = "inno_setup"
elevation = "required"

[checkver]
provider = "html_scrape"
url = "https://www.skywatcher.com/download/software/ascom-driver/"
regex = 'Version (\d+\.\d+\.\d+)'

[checkver.autoupdate]
url = "https://inter-static.skywatcher.com/downloads/setup_synscan_app_ascom_driver_$cleanVersion.exe"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{9f08ae3e-e063-460b-9cd1-7022450495d2}_is1"
registry_value = "DisplayVersion"
