manifest_version = 1
id = "zwo-ascom-driver-pack"
name = "ZWO ASCOM Driver Pack"
description = "Unified ASCOM driver for ZWO cameras, EAF focuser, EFW filter wheel, rotator, and AM mounts"
publisher = "ZWO"
homepage = "https://www.zwoastro.com"
category = "driver"
type = "driver"
slug = "zwo-ascom-driver-pack"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "redirect"
url = "https://dl.zwoastro.com/software?app=ASCOMDrive&platform=windows64&region=Overseas"
regex = 'ASCOM_Setup_V(\d+\.\d+\.\d+)\.exe'

[checkver.autoupdate]
url = "https://dl.zwoastro.com/software?app=ASCOMDrive&platform=windows64&region=Overseas"

[dependencies]
requires = ["ascom-platform", "zwo-native-driver"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ZWO ASCOM Driver_is1"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\ZWO\\ASIMount\\AM5Install.exe"
