manifest_version = 1
id = "sharpcap-app"
name = "SharpCap"
description = "SharpCap — live stacking and planetary/DSO capture"
publisher = "SharpCap"
homepage = "https://www.sharpcap.co.uk"
category = "capture"
type = "application"
slug = "sharpcap-app"

[install]
method = "burn"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "html_scrape"
url = "https://www.sharpcap.co.uk/wp-json/wp/v2/pages/13"
regex = 'version=(\d+\.\d+\.\d+\.\d+)'

[checkver.autoupdate]
resolver = "sharpcap"

[checkver.autoupdate.resolver_args]
arch = "x64"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{881672E1-F0EA-445C-89ED-78B74013DED2}"
registry_value = "DisplayVersion"
