manifest_version = 1
id = "sharpcap-app"
name = "SharpCap"
description = "SharpCap — live stacking and planetary/DSO capture"
publisher = "SharpCap"
homepage = "https://www.sharpcap.co.uk"
category = "imaging"
type = "application"
tags = ["imaging", "capture", "sharpcap"]
slug = "sharpcap-app"

[install]
method = "burn"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "html_scrape"
url = "https://www.sharpcap.co.uk/wp-json/wp/v2/pages/13"
regex = 'version=(\d+\.\d+\.\d+\.\d+)'

[checkver.autoupdate]
resolver = "sharpcap"

[checkver.autoupdate.resolver_args]
arch = "x64"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{0deb4972-8ce8-49d0-bd85-4d9bf5290e6c}"
registry_value = "DisplayVersion"
# NOTE: fallback path hardcodes version 4.1; update when a new major version releases.
fallback_method = "pe_file"
fallback_path = "C:\\Program Files\\SharpCap 4.1 (64 bit)\\SharpCap.exe"
