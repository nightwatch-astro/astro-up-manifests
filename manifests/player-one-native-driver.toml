manifest_version = 1
id = "player-one-native-driver"
name = "Player One Native Camera Driver"
description = "Native USB driver for Player One astronomy cameras"
publisher = "Player One Astronomy"
homepage = "https://player-one-astronomy.com"
category = "driver"
type = "usb_driver"
slug = "player-one-native-driver"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Player One Astronomy\\Camera Driver"
registry_value = "Version"

[install]
method = "nsis"
zip_wrapped = true

[checkver]
provider = "html_scrape"
url = "https://player-one-astronomy.com/service/software/"
regex = 'Player_One_Camera_Driver_V(\d+\.\d+\.\d+\.\d+)\.zip'

[checkver.autoupdate]
url = "https://player-one-astronomy.com/download/softwares/Player_One_Camera_Driver_V$version.zip"
