manifest_version = 1
id = "primaluce-arco"
name = "PrimaLuce ARCO Software Package"
description = "Driver and software package for PrimaLuce ARCO rotator"
publisher = "PrimaLuce Lab"
homepage = "https://www.primalucelab.com"
category = "driver"
type = "driver"
slug = "primaluce-arco"

[install]
method = "exe"
zip_wrapped = true

[checkver]
provider = "browser_scrape"
url = "https://www.primalucelab.com/info/downloads.html"
regex = 'ARCO-software-package-(\d+-\d+(?:-\d+)*)\.zip'

[checkver.autoupdate]
url = "https://www.primalucelab.com/downloads/ARCO-software-package-3-7.zip"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{a670a01f-e7af-49c9-aa67-b9fe518d7b35}_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Focuser\\PLL\\ASCOM.ArcoEsatto.exe"
