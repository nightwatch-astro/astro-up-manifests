manifest_version = 1
id = "zwo-asistudio"
name = "ZWO ASIStudio"
description = "ZWO all-in-one imaging suite for ASI cameras"
publisher = "ZWO"
homepage = "https://www.zwoastro.com"
category = "imaging"
type = "application"
tags = ["imaging", "capture", "zwo"]
slug = "zwo-asistudio"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\ZWO\\ASIStudio"
registry_value = "Version"
fallback_method = "pe_file"
fallback_path = "{program_dir}/ZWO/ASIStudio/ASIStudio.exe"

[install]
method = "nsis"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "redirect"
url = "https://dl.zwoastro.com/software?app=ASIStudio&platform=windows64&region=Overseas"
regex = 'ASIStudio_V(\d+\.\d+(?:\.\d+)*)_'

[checkver.autoupdate]
url = "https://dl.zwoastro.com/software?app=ASIStudio&platform=windows64&region=Overseas"
