manifest_version = 1
id = "qhy-allinone-beta"
name = "QHY AllInOne Driver Pack (Beta)"
description = "Beta AllInOne pack with priority support for recently released QHY camera models"
publisher = "QHY"
homepage = "https://www.qhyccd.com"
category = "driver"
type = "driver"
slug = "qhy-allinone-beta"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
# First AllInOne link on the page is the beta
provider = "browser_scrape"
url = "https://www.qhyccd.com/download/"
regex = 'QHYCCD_Win_AllInOne\.(\d+\.\d+\.\d+\.\d+)\.exe'

# No autoupdate URL — download URL extracted from page as asset (like GitHub)

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{4BE2CEB1-D9AF-46F6-8410-C87F172A587D}_is1"
registry_value = "DisplayVersion"
fallback_method = "pe_file"
fallback_path = "C:\\Program Files\\QHYCCD\\AllInOne\\ascom\\QHYCCD-ASCOM-Platform6.5-V25.06.16.16.exe"
