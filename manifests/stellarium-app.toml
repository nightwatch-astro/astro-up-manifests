manifest_version = 1
id = "stellarium-app"
name = "Stellarium"
description = "Stellarium — open-source planetarium"
publisher = "Stellarium"
homepage = "https://stellarium.org"
category = "planetarium"
type = "application"
slug = "stellarium-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "github"
owner = "Stellarium"
repo = "stellarium"

[checkver.autoupdate]
url = "https://github.com/Stellarium/stellarium/releases/download/v$version/stellarium-$version-qt6-win64.exe"
asset_filter = "qt6-win64\\.exe$"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Stellarium_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\Stellarium\\stellarium.exe"
