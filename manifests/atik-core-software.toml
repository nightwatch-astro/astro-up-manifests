manifest_version = 1
id = "atik-core-software"
name = "Atik Core Software"
description = "Core camera and filter wheel drivers with ASCOM for Atik cameras"
publisher = "Atik Cameras"
homepage = "https://www.atik-cameras.com"
category = "driver"
type = "driver"
slug = "atik-core-software"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "html_scrape"
url = "https://www.atik-cameras.com/software-downloads/"
regex = 'SetupAtikCamerasUniversal-(\d{4}\.\d{2}\.\d{2})\.exe'

[checkver.autoupdate]
url = "https://downloads.atik-cameras.com/SetupAtikCamerasUniversal-$version.exe"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\A71F468143F181DDC9BC8A9C59F4A375361817B9"
registry_value = "DisplayVersion"
