manifest_version = 1
id = "celestron-focuser-usb-ascom"
name = "Celestron Focuser USB ASCOM Driver"
description = "ASCOM driver for Celestron USB focuser"
publisher = "Celestron"
homepage = "https://www.celestron.com"
category = "driver"
type = "driver"
tags = ["ascom", "focuser", "celestron"]
slug = "celestron-focuser-usb-ascom"

[install]
method = "inno_setup"
elevation = "required"

[install.switches]
silent = "/S"

[checkver]
provider = "pe_download"
url = "https://software.celestron.com/public_release/Focuser_USB_ASCOM_Setup.exe"

[checkver.autoupdate]
url = "https://software.celestron.com/public_release/Focuser_USB_ASCOM_Setup.exe"

[dependencies]
requires = ["ascom-platform"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{9f0d3fe4-c081-4f93-8706-999f57555dd5}_is1"
registry_value = "DisplayVersion"

fallback_method = "pe_file"
fallback_path = "C:\\Program Files (x86)\\Common Files\\ASCOM\\Focuser\\FocusSim.exe"
