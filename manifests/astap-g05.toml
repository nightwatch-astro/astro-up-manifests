manifest_version = 1
id = "astap-g05"
name = "ASTAP G05 Galaxy Database"
description = "Large galaxy database for ASTAP plate solver (97 MB)"
publisher = "ASTAP"
homepage = "https://www.hnsky.org/astap.htm"
category = "platesolving"
type = "database"
slug = "astap-g05"

[install]
method = "inno_setup"
elevation = "required"

[checkver]
provider = "manual"
url = "https://sourceforge.net/projects/astap-program/files/star_databases/g05_star_database.exe/download"

[checkver.autoupdate]
url = "https://sourceforge.net/projects/astap-program/files/star_databases/g05_star_database.exe/download"
skip_browser_ua = true

[dependencies]
requires = ["astap-app"]

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ASTAP G05 star database. Star density up to 500 ~6874E3E9_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\astap\\dcraw.exe"
