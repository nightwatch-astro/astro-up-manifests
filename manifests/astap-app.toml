manifest_version = 1
id = "astap-app"
name = "ASTAP"
description = "ASTAP — astrometric stacking program, plate solver, and FITS viewer"
publisher = "ASTAP"
homepage = "https://www.hnsky.org/astap.htm"
category = "platesolving"
type = "application"
slug = "astap-app"

[install]
method = "inno_setup"

[install.switches]
silent = "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES"

[checkver]
provider = "html_scrape"
url = "https://www.hnsky.org/astap.htm"
regex = '\(v(\d{4}\.\d{2}\.\d{2})\)'

[checkver.autoupdate]
url = "https://sourceforge.net/projects/astap-program/files/windows_installer/astap_setup.exe/download"

[detection]
method = "registry"
registry_key = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\AppName=ASTAP, the Astrometric STAcking Program,~D52A8A79_is1"
registry_value = "DisplayVersion"

[detection.fallback]
method = "pe_file"
path = "C:\\Program Files\\astap\\dcraw.exe"
